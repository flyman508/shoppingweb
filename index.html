<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商城首页</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f6fa;
      color: #333;
    }

    /* 顶部导航 */
    header {
      background: linear-gradient(135deg, #111, #333);
      color: #fff;
      padding: 20px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: 2px;
    }

    nav a {
      color: #fff;
      margin-left: 25px;
      text-decoration: none;
      font-size: 16px;
      opacity: 0.85;
    }

    nav a:hover {
      opacity: 1;
    }

    /* Banner 区域 */
    .banner {
      height: 420px;
      background: linear-gradient(120deg, #1e3c72, #2a5298);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
    }

    .banner h2 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .banner p {
      font-size: 20px;
      opacity: 0.9;
    }

    .banner button {
      margin-top: 30px;
      padding: 14px 40px;
      font-size: 16px;
      border: none;
      border-radius: 30px;
      background: #ffcc00;
      cursor: pointer;
      transition: 0.3s;
    }

    .banner button:hover {
      background: #ffb700;
    }

    /* 商品区 */
    .section {
      padding: 60px;
      max-width: 1200px;
      margin: auto;
    }

    .section h3 {
      font-size: 28px;
      margin-bottom: 30px;
      text-align: center;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      transition: transform 0.3s;
    }

    .card:hover {
      transform: translateY(-8px);
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .card .info {
      padding: 20px;
    }

    .card h4 {
      margin: 0 0 10px;
    }

    .price {
      color: #e60023;
      font-size: 20px;
      font-weight: bold;
    }

    /* 页脚 */
    footer {
      background: #111;
      color: #aaa;
      text-align: center;
      padding: 30px 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- 顶部导航 -->
  <header>
    <h1>Future Mall</h1>
    <nav>
      <a href="#">首页</a>
      <a href="#">商品</a>
      <a href="#">优惠</a>
      <a href="#">会员</a>
      <a href="#">联系我们</a>
    </nav>
  </header>

  <!-- Banner -->
  <section class="banner">
    <div>
      <h2>品质生活 · 智选未来</h2>
      <p>发现高端好物，开启智能购物体验</p>
      <button>立即选购</button>
    </div>
  </section>

  <!-- 商品展示 -->
  <section class="section">
    <h3>精选推荐</h3>
    <div class="products">
      <div class="card">
        <img src="https://picsum.photos/400/300?1" />
        <div class="info">
          <h4>智能穿戴设备</h4>
          <div class="price">¥1299</div>
        </div>
      </div>

      <div class="card">
        <img src="https://picsum.photos/400/300?2" />
        <div class="info">
          <h4>高端无线耳机</h4>
          <div class="price">¥899</div>
        </div>
      </div>

      <div class="card">
        <img src="https://picsum.photos/400/300?3" />
        <div class="info">
          <h4>智能家居套装</h4>
          <div class="price">¥2599</div>
        </div>
      </div>
    </div>
  </section>

  <!-- 页脚 -->
  <footer>
    © 2025 Future Mall · 高端购物体验平台
  </footer>

</body>
</html>
